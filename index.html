<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор ставок</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin: auto;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background: #28a745;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Калькулятор ставок</h2>
        <label>Общая сумма:</label>
        <input type="number" id="totalAmount" placeholder="Введите сумму">
        <label>Коэффициент 1:</label>
        <input type="number" id="odd1" placeholder="Введите коэффициент">
        <label>Коэффициент 2:</label>
        <input type="number" id="odd2" placeholder="Введите коэффициент">
        <button onclick="calculate()">Рассчитать</button>
        <div class="result">
            <p>Ставка на исход 1: <span id="bet1">0</span></p>
            <p>Ставка на исход 2: <span id="bet2">0</span></p>
            <p>Прибыль при выигрыше 1: <span id="profit1">0</span></p>
            <p>Прибыль при выигрыше 2: <span id="profit2">0</span></p>
        </div>
    </div>

    <script>
        function calculate() {
            let totalAmount = parseFloat(document.getElementById('totalAmount').value);
            let odd1 = parseFloat(document.getElementById('odd1').value);
            let odd2 = parseFloat(document.getElementById('odd2').value);
            
            if (!totalAmount  !odd1  !odd2) {
                alert('Введите все значения!');
                return;
            }
            
            let stake1 = totalAmount / (1 + (odd1 / odd2));
            let stake2 = totalAmount - stake1;
            
            let profit1 = (stake1 * odd1) - totalAmount + (stake2 * 0.1);
            let profit2 = (stake2 * odd2) - totalAmount + (stake1 * 0.1);
            
            document.getElementById('bet1').innerText = stake1.toFixed(2);
            document.getElementById('bet2').innerText = stake2.toFixed(2);
            document.getElementById('profit1').innerText = profit1.toFixed(2);
            document.getElementById('profit2').innerText = profit2.toFixed(2);
        }
    </script>
</body>
</html>
